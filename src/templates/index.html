{% extends "base.html" %}
{% block title %}PatentSearch{% endblock %}

{% block body %}
<div class="home-wrapper">
  <div class="home-center">

    <div class="logo">
      <img src="{{ url_for('static', filename='PriorArt.png') }}" alt="PriorArt" class="logo-img" />
    </div>

    <form class="search-form" action="/search" method="get">
      <div class="search-bar">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                fill="none"/>
        </svg>
        <input
          type="text"
          name="q"
          class="search-input"
          placeholder="Search patents…"
          autofocus
          autocomplete="off"
        />
      </div>
      <button type="submit" class="search-btn">Search Patents</button>
    </form>

    <p class="home-hint">Search across <strong>CLEF-IP</strong> patent documents by keyword, technology, or IPC code.</p>
  </div>
</div>
{% endblock %}
